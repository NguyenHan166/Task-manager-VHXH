name: office-workspace-local
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:?Run npm run db:init first}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run npm run db:init first}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:?Run npm run db:init first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
